name: Release

# Builds Strata Monitor.app on a Mac, signs the app and its helper with the Developer ID certificate,
# has Apple notarize it, and packages a disk image and a zip.
#
#   git tag v0.1.0 && git push origin v0.1.0
#       Publishes a GitHub Release with StrataMonitor.dmg, StrataMonitor.zip and SHA256SUMS.txt. The tag
#       must match CFBundleShortVersionString in Resources/Info.plist. A tag with a suffix
#       (v0.2.0-beta.1) is published as a pre-release.
#   Actions tab -> Release -> Run workflow
#       Builds the same files as a workflow artifact, without a release.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   MACOS_CERT_P12        base64 of the "Developer ID Application" certificate and its private key, exported as .p12
#   MACOS_CERT_PASSWORD   the .p12's password
#   MACOS_API_KEY_P8      base64 of an App Store Connect API key (.p8), used to notarize
#   MACOS_API_KEY_ID      that key's ID
#   MACOS_API_ISSUER_ID   its issuer ID
#   SPARKLE_ED_PRIVATE_KEY  Sparkle update signing key; SUPublicEDKey in Info.plist must match
#   MACOS_TEAM_ID         the Apple Developer team ID
# Without them a manual run still builds an ad-hoc signed copy for testing, and a tag fails:
# Gatekeeper refuses an unsigned app on any other Mac, so it must never become a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      retention_days:
        description: Days to keep the artifact
        type: string
        default: "3"

# Least privilege: only the release job can write, and only to releases.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.6"
  # Secrets can't be read in an `if:`, so their presence is evaluated once here and tested as a string.
  HAS_UPDATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
  HAS_APPLE_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to release an unsigned build
        if: github.ref_type == 'tag' && env.HAS_APPLE_SIGNING != 'true'
        run: |
          echo "::error::The signing secrets are not set (see the top of release.yml). A release has to be signed and notarized."
          exit 1

      - name: Refuse to release without an update signing key
        if: github.ref_type == 'tag' && env.HAS_UPDATE_KEY != 'true'
        run: |
          echo "::error::SPARKLE_ED_PRIVATE_KEY is required for signed update archives and feeds."
          exit 1

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          # scripts/toolchain.sh otherwise picks /Applications/Xcode.app.
          echo "DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" >> "$GITHUB_ENV"
          swift --version

      - name: Work out the version
        id: version
        env:
          # Passed as env, never interpolated into the script, so a tag name can't reach the shell as code.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$REF_TYPE" = tag ]; then VERSION="${REF_NAME#v}"; else VERSION="$BUNDLE_VERSION"; fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-beta.1"; exit 1; }
          [ "${VERSION%%-*}" = "$BUNDLE_VERSION" ] || {
            echo "::error::the tag says $VERSION but Resources/Info.plist says $BUNDLE_VERSION"; exit 1; }
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          if [ "$REF_TYPE" = tag ]; then ARTIFACT="StrataMonitor-$VERSION"; else ARTIFACT="StrataMonitor-$VERSION-build$RUN_NUMBER"; fi
          {
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "artifact=$ARTIFACT"
          } >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RUN_NUMBER" Resources/Info.plist
          echo "building Strata Monitor $VERSION ($RUN_NUMBER)"

      - name: Validate translations and release tooling
        run: |
          python3 scripts/localize.py extract --check-source
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 scripts/localize.py check
          python3 scripts/readme-localize.py check

      - name: Run the tests before signing
        run: scripts/test.sh

      - name: Import the Developer ID certificate into a temporary keychain
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign waits on a keychain prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build Strata Monitor.app
        run: STRATA_BAR_SIGNING_IDENTITY="${SIGN_IDENTITY:--}" scripts/build.sh release

      - name: Check the app
        run: |
          set -euo pipefail
          APP="build/Strata Monitor.app"
          codesign --verify --strict --deep --verbose=2 "$APP"
          for code in "$APP" "$APP/Contents/MacOS/StrataBarHelper"; do
            codesign -dvv "$code" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Timestamp|Runtime Version)" || true
          done
          echo "architectures: $(lipo -archs "$APP/Contents/MacOS/StrataBar")"

      - name: Notarize, staple and package
        env:
          API_KEY_P8: ${{ secrets.MACOS_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="build/Strata Monitor.app"
          mkdir -p dist
          signed=false
          if [ "$HAS_APPLE_SIGNING" = true ]; then signed=true; fi

          if [ "$signed" = true ]; then
            printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api.p8"
            trap 'rm -f "$RUNNER_TEMP/api.p8"' EXIT
            auth=(--key "$RUNNER_TEMP/api.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --team-id "$TEAM_ID")
            # Submits and waits; anything but "Accepted" prints Apple's log and fails the build.
            notarize() {
              local out id status
              out=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 30m --output-format json) || true
              id=$(printf '%s' "$out" | plutil -extract id raw -o - - 2>/dev/null || true)
              status=$(printf '%s' "$out" | plutil -extract status raw -o - - 2>/dev/null || true)
              echo "notarization of $(basename "$1"): ${status:-no answer} ${id}"
              if [ "$status" != Accepted ]; then
                echo "$out"
                [ -n "$id" ] && xcrun notarytool log "$id" "${auth[@]}" || true
                echo "::error::notarization of $(basename "$1") ended as '${status:-unknown}'"
                return 1
              fi
            }

            # 1. The app itself, stapled, so it also opens offline once copied out of the disk image.
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
            notarize "$RUNNER_TEMP/notarize-app.zip"
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl --assess --type execute -vv "$APP"
          else
            echo "::warning::Signing secrets not set: this build is ad-hoc signed and Gatekeeper will refuse it on other Macs. Don't share it."
          fi

          # 2. The disk image: the app next to a link to Applications, where the helper needs it to be.
          stage="$RUNNER_TEMP/dmg"
          rm -rf "$stage" && mkdir -p "$stage"
          ditto "$APP" "$stage/Strata Monitor.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Strata Monitor" -srcfolder "$stage" -fs HFS+ -format UDZO -ov dist/StrataMonitor.dmg
          if [ "$signed" = true ]; then
            codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" dist/StrataMonitor.dmg
            notarize dist/StrataMonitor.dmg
            xcrun stapler staple dist/StrataMonitor.dmg
            xcrun stapler validate dist/StrataMonitor.dmg
            spctl --assess --type open --context context:primary-signature -vv dist/StrataMonitor.dmg
          fi

          # 3. The stapled app as a zip, for people who'd rather not mount an image.
          ditto -c -k --keepParent "$APP" dist/StrataMonitor.zip
          (cd dist && shasum -a 256 StrataMonitor.dmg StrataMonitor.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh dist

      - name: Sign the update archive and feed
        if: github.ref_type == 'tag'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/appcast.py "$VERSION"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          retention-days: ${{ github.ref_type == 'tag' && 7 || inputs.retention_days }}
          if-no-files-found: error
          # A disk image and a zip are already compressed.
          compression-level: 0

      - name: Remove the temporary keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/StrataMonitor.dmg dist/StrataMonitor.zip dist/SHA256SUMS.txt dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --title "Strata Monitor $VERSION" --verify-tag "${flags[@]}"
