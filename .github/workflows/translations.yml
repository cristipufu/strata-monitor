name: Translations and release tooling

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Validate catalogs, generated READMEs and signed feed tooling
        run: |
          python3 scripts/localize.py extract --check-source
          python3 -m unittest discover -s Tests -p 'test_*.py'
          python3 scripts/localize.py check
          python3 scripts/readme-localize.py check
      - name: Run headless tests
        run: scripts/test.sh
