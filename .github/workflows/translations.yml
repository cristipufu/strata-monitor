name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
      - name: Resolve dependencies for update signature tests
        run: swift package resolve
      - name: Check extracted app messages
        run: python3 scripts/localize.py extract --check-source
      - name: Test localization and update signing tools
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Validate app and README translations
        run: |
          python3 scripts/localize.py check
          python3 scripts/readme-localize.py check
      - name: Run headless tests
        id: tests
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no
        run: scripts/test.sh
      - name: Report test crashes
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          for report in sorted(reports.glob("StrataBarPackageTests*.ips"))[-3:]:
              print(f"::group::{report.name}")
              print(report.read_text()[:262144])
              print("::endgroup::")
          PY
